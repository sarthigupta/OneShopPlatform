services:
  postgres:
    image: postgres:17-alpine
    container_name: oneshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oneshop}
      POSTGRES_USER: ${POSTGRES_USER:-oneshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oneshop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oneshop} -d ${POSTGRES_DB:-oneshop}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
