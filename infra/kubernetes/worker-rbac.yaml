apiVersion: v1
kind: ServiceAccount
metadata:
  name: oneshop-worker
  namespace: oneshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneshop-worker
  namespace: oneshop
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oneshop-worker
  namespace: oneshop
subjects:
  - kind: ServiceAccount
    name: oneshop-worker
    namespace: oneshop
roleRef:
  kind: Role
  name: oneshop-worker
  apiGroup: rbac.authorization.k8s.io